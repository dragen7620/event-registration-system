<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Supabase 雲端 Todo List</title>
  <!-- 引入 Tailwind CSS (美化介面) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 透過 CDN 引入 @supabase/supabase-js 套件 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-100 via-indigo-50/50 to-slate-100 py-12 px-4 text-slate-800 antialiased">

  <div class="mx-auto max-w-lg">
    <!-- 主卡片容器 -->
    <div class="overflow-hidden rounded-3xl bg-white shadow-xl ring-1 ring-slate-200/80">
      
      <!-- 頂部標題區 -->
      <div class="bg-gradient-to-r from-indigo-600 to-violet-600 px-6 py-7 text-white">
        <div class="flex items-center justify-between">
          <div>
            <h1 class="text-2xl font-extrabold tracking-tight">📝 我的待辦清單</h1>
            <p class="mt-1 text-xs text-indigo-100">Powered by Supabase & Vercel</p>
          </div>
          <span id="status-badge" class="rounded-full bg-white/20 px-3 py-1 text-xs font-medium backdrop-blur-sm">
            連線準備中...
          </span>
        </div>
      </div>

      <div class="p-6 sm:p-7">
        <!-- 未設定金鑰時的提醒橫幅 -->
        <div id="config-warning" class="mb-5 hidden rounded-2xl border border-amber-200 bg-amber-50 p-4 text-xs leading-relaxed text-amber-800">
          <strong>⚠️ 尚未填入 Supabase 金鑰：</strong><br />
          請打開 <code class="rounded bg-amber-100 px-1.5 py-0.5 font-mono font-bold">index.html</code>，在下方 <code class="font-mono font-bold">&lt;script&gt;</code> 區塊填入您的 <code class="font-mono font-bold">SUPABASE_URL</code> 與 <code class="font-mono font-bold">SUPABASE_ANON_KEY</code>。
        </div>

        <!-- 錯誤訊息提示區 -->
        <div id="error-box" class="mb-5 hidden rounded-2xl border border-rose-200 bg-rose-50 p-4 text-xs font-medium text-rose-700"></div>

        <!-- 新增待辦事項表單 -->
        <form id="todo-form" class="flex gap-2.5">
          <input
            id="todo-input"
            type="text"
            required
            placeholder="輸入新的待辦事項..."
            class="flex-1 rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-900 placeholder:text-slate-400 transition focus:border-indigo-500 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500/20"
          />
          <button
            id="submit-btn"
            type="submit"
            class="inline-flex shrink-0 items-center justify-center rounded-xl bg-indigo-600 px-5 py-3 text-sm font-bold text-white shadow-sm transition hover:bg-indigo-700 active:scale-[0.98] disabled:opacity-50"
          >
            新增
          </button>
        </form>

        <!-- 清單統計與重新整理 -->
        <div class="mt-6 flex items-center justify-between border-b border-slate-100 pb-2.5 text-xs text-slate-500">
          <span id="todo-count">共 0 項待辦</span>
          <button
            id="refresh-btn"
            type="button"
            class="font-medium text-indigo-600 hover:text-indigo-800"
          >
            ↻ 重新整理
          </button>
        </div>

        <!-- 待辦清單列表 -->
        <ul id="todo-list" class="mt-3 divide-y divide-slate-100">
          <li class="py-8 text-center text-sm text-slate-400">載入資料中...</li>
        </ul>
      </div>
    </div>
  </div>

  <script>
    // =========================================================================
    // 👇 請在下方填入您自己的 Supabase 專案 URL 與 Anon Key 👇
    // 取得位置：Supabase 後台 -> Project Settings (齒輪) -> API
    // =========================================================================
    const SUPABASE_URL = 'https://qfbijrsmazgubmrovmvm.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_gztZKkJAyVa8vP0wOCAyQg_IcVnqxRy';
    // =========================================================================

    const statusBadge = document.getElementById('status-badge');
    const configWarning = document.getElementById('config-warning');
    const errorBox = document.getElementById('error-box');
    const todoForm = document.getElementById('todo-form');
    const todoInput = document.getElementById('todo-input');
    const submitBtn = document.getElementById('submit-btn');
    const todoList = document.getElementById('todo-list');
    const todoCount = document.getElementById('todo-count');
    const refreshBtn = document.getElementById('refresh-btn');

    // 檢查是否已經替換預設的變數
    const isConfigured =
      SUPABASE_URL &&
      SUPABASE_ANON_KEY &&
      SUPABASE_URL !== 'YOUR_SUPABASE_URL' &&
      SUPABASE_ANON_KEY !== 'YOUR_SUPABASE_ANON_KEY' &&
      SUPABASE_URL.startsWith('http');

    let supabaseClient = null;

    if (!isConfigured) {
      configWarning.classList.remove('hidden');
      statusBadge.textContent = '尚未設定 Key';
      statusBadge.className = 'rounded-full bg-amber-400/30 px-3 py-1 text-xs font-semibold text-amber-100';
      todoList.innerHTML = '<li class="py-8 text-center text-sm text-slate-400">請先於程式碼中填入 Supabase URL 與 Key</li>';
    } else {
      // 初始化 Supabase Client
      const { createClient } = window.supabase;
      supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      statusBadge.textContent = 'Supabase 已連線';
    }

    // 顯示錯誤輔助函式
    function showError(message) {
      errorBox.textContent = message;
      errorBox.classList.remove('hidden');
    }

    function clearError() {
      errorBox.textContent = '';
      errorBox.classList.add('hidden');
    }

    // 格式化時間顯示
    function formatTime(isoString) {
      if (!isoString) return '';
      const date = new Date(isoString);
      return date.toLocaleString('zh-TW', {
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
      });
    }

    // 1. 讀取 todos 資料表資料
    async function fetchTodos() {
      if (!supabaseClient) return;
      clearError();

      const { data, error } = await supabaseClient
        .from('todos')
        .select('id, title, created_at')
        .order('created_at', { ascending: false });

      if (error) {
        showError('讀取失敗：' + error.message + '（請確認 todos 資料表及 RLS 權限是否已開啟）');
        todoList.innerHTML = '<li class="py-8 text-center text-sm text-rose-400">無法載入資料</li>';
        return;
      }

      renderTodos(data || []);
    }

    // 渲染清單畫面
    function renderTodos(todos) {
      todoCount.textContent = `共 ${todos.length} 項待辦`;

      if (todos.length === 0) {
        todoList.innerHTML = `
          <li class="py-10 text-center text-sm text-slate-400">
            目前還沒有待辦事項，在上方輸入框新增第一筆吧！
          </li>
        `;
        return;
      }

      todoList.innerHTML = todos
        .map(
          (item) => `
          <li class="group flex items-center justify-between gap-3 py-3.5 transition hover:bg-slate-50/80 px-2 rounded-xl">
            <div class="flex items-center gap-3 min-w-0">
              <span class="flex h-2.5 w-2.5 shrink-0 rounded-full bg-indigo-500"></span>
              <span class="truncate text-sm font-medium text-slate-800">${escapeHtml(item.title || '')}</span>
            </div>
            <span class="shrink-0 text-xs text-slate-400">${formatTime(item.created_at)}</span>
          </li>
        `
        )
        .join('');
    }

    // 防止 XSS 字元轉義
    function escapeHtml(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // 2. 新增資料至 Supabase todos 資料表
    todoForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!supabaseClient) {
        showError('請先在 index.html 填入您的 SUPABASE_URL 與 SUPABASE_ANON_KEY！');
        return;
      }

      const title = todoInput.value.trim();
      if (!title) return;

      clearError();
      submitBtn.disabled = true;
      submitBtn.textContent = '新增中...';

      const { error } = await supabaseClient
        .from('todos')
        .insert([{ title }]);

      submitBtn.disabled = false;
      submitBtn.textContent = '新增';

      if (error) {
        showError('新增失敗：' + error.message + '（請檢查 RLS Insert 權限是否開啟）');
        return;
      }

      // 清空輸入框並重新讀取最新列表
      todoInput.value = '';
      await fetchTodos();
    });

    // 重新整理按鈕
    refreshBtn.addEventListener('click', fetchTodos);

    // 頁面載入時自動執行讀取
    window.addEventListener('DOMContentLoaded', fetchTodos);
  </script>
</body>
</html>
